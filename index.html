/* =========================

========================= */

}

.header-glow{

    align-items:center;

.status-dot{

}

.online-pill{

    align-items:center;
    gap:6px;
    width:fit-content;
    margin-top:6px;

/* =========================

========================= */

}

.chat-container::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);
    border-radius:999px;
}

/* =========================
   Bubbles
========================= */

    margin-bottom:4px;

    line-height:2;

}

.user{

========================= */

    background:#cbd5e1;
    animation:bounce 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:translateY(0);
        opacity:.4;
    }

    40%{
        transform:translateY(-6px);
        opacity:1;
    }
}

@keyframes fadeUp{
    from{

        transform:translateY(10px);
    }

    }
}

/* =========================
   إرسال إلى Gemini
========================= */

async function askGemini(apiKey, userMsg) {
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;

    // 1. جلب تاريخ المحادثة من LocalStorage
    const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    
    // 2. تحويل التاريخ إلى صيغة نصية يفهمها الذكاء الاصطناعي
    const chatHistoryContext = history.map(m => 
        `${m.type === 'user' ? 'العميل' : 'سند'}: ${m.text}`
    ).join('\n');

    const payload = {
        contents: [
            {
                role: "user",
                parts: [
                    {
                        text: `
${BASE_KNOWLEDGE}

========================
سجل المحادثة السابقة:
${chatHistoryContext}

رسالة العميل الحالية:
${userMsg}
`
                    }
                ]
            }
        ],
        generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 800 // زدنا التوكنز للمقارنات الطويلة
        }
    };

    const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data?.error?.message || "API ERROR");

    return data?.candidates?.[0]?.content?.parts?.[0]?.text;
}

/* =========================
   تبديل المفاتيح تلقائياً

async function getAIResponse(userMsg){

    for(const key of API_KEYS){

        try{

            const result = await askGemini(key,userMsg);

            if(result){

                return result;
            }

        }catch(error){

            console.error("KEY FAILED:",error.message);

            continue;
        }
    }

    return "❌ جميع مفاتيح الذكاء الاصطناعي متوقفة حالياً.";
}

    const msg = userInput.value.trim();

    addBubble(msg,'user');

    userInput.value = '';

    isLoading = true;

    showTyping();

    const reply = await getAIResponse(msg);

    removeTyping();

    addBubble(reply,'ai');

    isLoading = false;
}

const STORAGE_KEY = "ltmobile_chat_history";

function saveMessage(text, type){

    let history = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || [];

    history.push({
        text,
        type,
        time: Date.now()
    });

    // الاحتفاظ بآخر 5 رسائل فقط
    if(history.length > 5){
        history = history.slice(-5);
    }

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(history)
    );
}

function loadMessages(){

    const history = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || [];

    if(history.length){

        history.forEach(msg=>{

            addBubble(msg.text,msg.type);

        });

        addBubble(
`مرحباً 👋
أنا سند، مساعد شركة LT Mobile.
كيف أقدر أخدمك اليوم؟`,
'ai'
        );
    }
}
